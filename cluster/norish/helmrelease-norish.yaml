apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: norish
  namespace: norish
spec:
  chart:
    spec:
      chart: app-template
      version: 5.0.x
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  releaseName: norish
  values:
    controllers:
      norish:
        containers:
          app:
            image:
              repository: norishapp/norish
              tag: v0.26.1-beta@sha256:fa026262378cf6b0cb855acc4a84ec0e3ca9e8e46531acfaeb49919d0ee7ca3c
            env:
              TZ: ${TIMEZONE}
              AUTH_URL: https://norish.${CLUSTER_DOMAIN}
              VALKEY_URL: valkey://norish-valkey:6379
              OBSCURA_ENDPOINT: ws://norish-obscura:9222
              UPLOADS_DIR: /app/uploads
              AI_ENABLED: "true"
              AI_PROVIDER: generic-openai # plain "openai" ignores AI_ENDPOINT
              AI_ENDPOINT: https://openrouter.ai/api/v1
              AI_MODEL: google/gemini-2.5-flash-lite
              VIDEO_PARSING_ENABLED: "true"
              TRANSCRIPTION_PROVIDER: generic-openai
              TRANSCRIPTION_MODEL: openai/whisper-large-v3-turbo
              # transcription endpoint/key fall back to the AI_* ones
              AI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: norish-openrouter
                    key: AI_API_KEY
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: norish-postgres-credentials
                    key: DATABASE_URL
            envFrom:
              - secretRef:
                  name: norish-credentials
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health/live
                    port: 3000
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health/live
                    port: 3000
                  failureThreshold: 30
                  periodSeconds: 5
      valkey:
        containers:
          app:
            image:
              repository: valkey/valkey
              tag: 9.2.0@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056
      obscura:
        containers:
          app:
            image:
              repository: norishapp/obscura
              tag: 0.2.5-norish.1@sha256:7bd78a6dbb8329a172f8c4d38cd7a875139b5a7756118579c376c978f612a0a9
            envFrom:
              - secretRef:
                  name: norish-credentials # only OBSCURA_CDP_TOKEN is used

    service:
      main:
        controller: norish
        ports:
          http:
            port: 3000
      valkey:
        controller: valkey
        ports:
          valkey:
            port: 6379
      obscura:
        controller: obscura
        ports:
          cdp:
            port: 9222

    ingress:
      app:
        enabled: true
        className: nginx
        hosts:
          - host: &host norish.${CLUSTER_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
        - secretName: letsencrypt-wildcard-cert-prod
          hosts:
          - *host

    persistence:
      uploads:
        enabled: true
        type: persistentVolumeClaim
        size: 5Gi
        accessMode: ReadWriteOnce
        storageClass: truenas-ssd-iscsi
        advancedMounts:
          norish:
            app:
              - path: /app/uploads
      valkey-data:
        enabled: true
        type: persistentVolumeClaim
        size: 1Gi
        accessMode: ReadWriteOnce
        storageClass: truenas-ssd-iscsi
        advancedMounts:
          valkey:
            app:
              - path: /data
