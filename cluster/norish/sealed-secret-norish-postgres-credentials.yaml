---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: norish-postgres-credentials
  namespace: norish
spec:
  encryptedData:
    DATABASE_URL: 
    password: 
    username: 
  template:
    metadata:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: cloudnative-pg
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: cloudnative-pg
      name: norish-postgres-credentials
      namespace: norish
    type: kubernetes.io/basic-auth
