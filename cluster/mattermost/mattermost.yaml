apiVersion: installation.mattermost.com/v1beta1
kind: Mattermost
metadata:
  name: mattermost
  namespace: mattermost
spec:
  size: 100users
  replicas: 1 # >1 needs an Enterprise license
  image: mattermost/mattermost-team-edition@sha256:35927b9c535a9eb74f0e45385d3fe5d8308b16e0464031f157a834da8af3ee73
  # the operator renders image:version, so the digest rides along with the tag
  version: 12.1.0@sha256:35927b9c535a9eb74f0e45385d3fe5d8308b16e0464031f157a834da8af3ee73
  mattermostEnv:
    - name: MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS
      value: "true"
    - name: MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER
      value: "https://push-test.mattermost.com"
  ingress:
    enabled: true
    host: mattermost.${CLUSTER_DOMAIN}
    ingressClass: nginx
    tlsSecret: letsencrypt-wildcard-cert-prod
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 100m
  database:
    external:
      secret: mattermost-postgres-credentials
    # readinessCheck:
    #   mode: builtin
  fileStore:
    external:
      # S3 gateway through the s3 ingress
      url: s3.${CLUSTER_DOMAIN}
      bucket: mattermost
      secret: mattermost-s3-credentials
