apiVersion: batch/v1
kind: CronJob
metadata:
  name: restart-deployment
  namespace: democratic-csi
spec:
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  schedule: '0 */6 * * *' # Every 6h
  jobTemplate:
    spec:
      backoffLimit: 2 
      activeDeadlineSeconds: 600 
      template:
        spec:
          serviceAccountName: restart-deployment
          restartPolicy: Never
          containers:
            - name: restart-iscsi-deployment
              image: bitnami/kubectl@sha256:ab90e1058e5a658cc94b4e7eb6d48e5758cfd6d77b5dd1869513aec3a3054673 
              command:
                - 'kubectl'
                - 'rollout'
                - 'restart'
                - 'deployment/democratic-csi-ssd-iscsi-controller'
            - name: restart-nfs-deployment
              image: bitnami/kubectl@sha256:ab90e1058e5a658cc94b4e7eb6d48e5758cfd6d77b5dd1869513aec3a3054673 
              command:
                - 'kubectl'
                - 'rollout'
                - 'restart'
                - 'deployment/democratic-csi-ssd-nfs-controller'