apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: happier
  namespace: happier
spec:
  chart:
    spec:
      chart: app-template
      version: 5.0.x
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  releaseName: happier
  values:
    controllers:
      happier:
        strategy: Recreate # single RWO volume + SQLite
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
            
        containers:
          app:
            image:
              repository: happierdev/relay-server
              tag: stable@sha256:6b2ec77225cf63f4417b22691fc6ea19199f72e9ec30cc0d6eb64f4180d26abe
            env:
              TZ: ${TIMEZONE}
              PORT: "3005"
            envFrom:
              - secretRef:
                  name: happier-credentials
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3005
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3005
                  failureThreshold: 30
                  periodSeconds: 5

    service:
      main:
        controller: happier
        ports:
          http:
            port: 3005

    ingress:
      app:
        enabled: true
        className: nginx
        annotations:
          # socket.io at /v1/updates needs long-lived websocket connections
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        hosts:
          - host: &host happier.${CLUSTER_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
        - secretName: letsencrypt-wildcard-cert-prod
          hosts:
          - *host

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        size: 5Gi
        globalMounts:
          - path: /data
        accessMode: ReadWriteOnce
        storageClass: truenas-ssd-iscsi
