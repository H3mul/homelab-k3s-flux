apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gyroidvault
  namespace: gyroidvault
spec:
  chart:
    spec:
      chart: app-template
      version: 5.0.x
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  releaseName: gyroidvault
  values:
    controllers:
      gyroidvault:
        pod:
          securityContext:
            runAsUser: ${FILESHARE_USER_ID}
            runAsGroup: ${FILESHARE_GROUP_ID}
            fsGroup: ${FILESHARE_GROUP_ID}
            fsGroupChangePolicy: "OnRootMismatch"
            
        containers:
          app:
            image:
              repository: ghcr.io/h3mul/gyroidvault
              tag: v2.5.0@sha256:4b727647e3c4fadd59b7e76e8e27e0f30624f80f41d4b0772036ef077e6f59eb
            env:
              NODE_ENV: production
              PORT: "3000"
              LIBRARY_PATH: /library
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
              readiness: *probe

    service:
      main:
        controller: gyroidvault
        ports:
          http:
            port: 3000

    ingress:
      app:
        enabled: true
        className: nginx
        hosts:
          - host: &host gyroidvault.${CLUSTER_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: letsencrypt-wildcard-cert-prod
            hosts:
              - *host

    persistence:
      # NFS export on truenas hdd-replicated
      library:
        enabled: true
        existingClaim: gyroidvault-library
        globalMounts:
          - path: /library
      # unreplicated SSD, backed up by volsync
      data:
        enabled: true
        type: persistentVolumeClaim
        size: 5Gi
        accessMode: ReadWriteOnce
        storageClass: truenas-ssd-iscsi
        globalMounts:
          - path: /app/data
