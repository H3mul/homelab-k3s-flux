apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: b2-gyroidvault-data
  namespace: gyroidvault
spec:
  sourcePVC: gyroidvault
  trigger:
    schedule: 30 0 * * 0
  restic:
    repository: b2-gyroidvault-data-restic

    copyMethod: Snapshot
    volumeSnapshotClassName: truenas-ssd-iscsi
    storageClassName: truenas-ssd-iscsi

    pruneIntervalDays: 10
    cacheCapacity: 5Gi
    retain:
      daily: 7
      weekly: 4
      monthly: 6
      within: 3d
