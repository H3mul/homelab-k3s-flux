apiVersion: v1
kind: Service
metadata:
  name: timescale-cluster
  namespace: cloudnative-pg
  annotations:
    external-dns.alpha.kubernetes.io/hostname: timescale.${CLUSTER_DOMAIN}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: timescale-cluster
    role: primary
