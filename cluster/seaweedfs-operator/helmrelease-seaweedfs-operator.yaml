apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
  namespace: seaweedfs
spec:
  chart:
    spec:
      chart: seaweedfs-operator
      version: 0.1.49
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator
        namespace: flux-system
  interval: 15m
  timeout: 5m
  releaseName: seaweedfs-operator
  values:
    # dashboard is provisioned from our own grafana instead (cluster/grafana)
    grafanaDashboard:
      enabled: false
    serviceMonitor:
      enabled: true
